name: Bug report
description: Something the harness got wrong (missed PII, false delete flag, crash).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** attach a real handover dump, tax form, or student file.
        Reproduce with a synthetic document (see `burling/tests/fixtures/tiny-dump`).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: python -m burling.run --priors-only --intake ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic repro
      description: Paste a tiny fake file, or point at a fixture path. No real PII.
    validations:
      required: true
