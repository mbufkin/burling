[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burling"
version = "0.2.0"
description = "Local handover clerk: extract, leftover PII judge, walk organize. Never auto-deletes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Michael Bufkin" }]
keywords = ["privacy", "pii", "document-review", "organize", "local-llm", "ollama", "records"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pypdf>=5.0.0",
    "cryptography>=42.0.0",
    "PyYAML>=6.0",
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.4.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
burling = "burling.run:main"
burling-compare = "burling.compare_placements:main"

[project.urls]
Homepage = "https://github.com/mbufkin/burling"
Issues = "https://github.com/mbufkin/burling/issues"
Changelog = "https://github.com/mbufkin/burling/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["burling*"]

[tool.setuptools.package-data]
burling = ["config.example.yaml", "map.yml"]
