# Workplace file plan on the same 400 20news files — gb10 Lightning only.
# New folder so the first layers tree, clerk tree, and RALP tree stay intact.
# Reuses tags.json only as the 400-file list; every file is re-tagged
# onto the locked workplace mains (docs/file-plan-layers.md).
ollama:
  url: "http://127.0.0.1:8080"
  api: "openai"
  model: "/home/lenovo/llama.cpp/models/nemotron35-lightning-30b.gguf"
  timeout_seconds: 600
  temperature: 0.1
  max_tokens: 4096
  enable_thinking: false

paths:
  intake_dir: "/home/lenovo/gold-20news/inbox"
  output_dir: "/home/lenovo/gold-20news/layers-workplace"
  tags_json: "/home/lenovo/gold-20news/output/tags.json"

chunking:
  threshold_chars: 80000
  chunk_chars: 80000
  overlap_chars: 400

policy:
  never_delete: true
  local_only: true
  redact_pii_in_ledger: true
  fail_closed_on_personal_tax: true
