# Burling — local-only, TAR-style two-pass document review.
# Doctrine comes from Loom (mbufkin/loom, docs/BETS.md Bets 0, 1, 2, 6, 9):
#   one file, one call, full text, regex is a prior, cache by hash, never auto-delete.

ollama:
  url: "http://127.0.0.1:11434"
  # 7B fits the RTX 3060 Ti 8 GB. Swap to llama3.2:3b if VRAM is tight.
  model: "qwen2.5-coder:7b"
  timeout_seconds: 300
  temperature: 0.1

paths:
  intake_dir: "intake"
  output_dir: "output"

# 7B context is ~32k tokens. Stay well under that so the JSON answer still fits.
chunking:
  threshold_chars: 12000
  chunk_chars: 10000
  overlap_chars: 400

policy:
  never_delete: true          # harness only flags; a human confirms
  local_only: true            # refuse any non-localhost model URL
  redact_pii_in_ledger: true  # never write raw SSN/CC into output/
  # SSN alone is NOT a delete. Student immunization / work travel can have PII
  # and still be district records. Force-delete only personal tax/mortgage filenames.
  fail_closed_on_personal_tax: true

# Shared Drive stream: python -m burling.stream
rclone:
  bin: "tools/rclone/rclone.exe"
  remote: "disd:"
