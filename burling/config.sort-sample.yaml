# Public-style RALP smoke (any-dump). Not a district handover.
# Uses the same llama.cpp server the box already runs — do not point this at Ollama.
#   python -m burling.run --config burling/config.sort-sample.yaml --ralp
#
# On gb10, llama-server is already on :8080 (Nemotron 3.5 Lightning 30B).
# On this Mac, either run there or SSH-tunnel 8080 first.
ollama:
  url: "http://127.0.0.1:8080"
  api: "openai"
  model: "/home/lenovo/llama.cpp/models/nemotron35-lightning-30b.gguf"
  timeout_seconds: 600
  temperature: 0.1
  max_tokens: 4096
  enable_thinking: false

paths:
  intake_dir: "tests/fixtures/sort-sample"
  output_dir: "output-sort-sample"

chunking:
  threshold_chars: 12000
  chunk_chars: 10000
  overlap_chars: 400

policy:
  never_delete: true
  local_only: true
  redact_pii_in_ledger: true
  fail_closed_on_personal_tax: true
