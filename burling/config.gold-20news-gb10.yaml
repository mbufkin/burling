# 20 Newsgroups gold inbox — run on gb10 only (Lightning / llama.cpp :8080).
# Do not point this at the Mac or the NVIDIA cloud proxy.
ollama:
  url: "http://127.0.0.1:8080"
  api: "openai"
  model: "/home/lenovo/llama.cpp/models/nemotron35-lightning-30b.gguf"
  timeout_seconds: 600
  temperature: 0.1
  max_tokens: 4096
  enable_thinking: false

paths:
  intake_dir: "/home/lenovo/gold-20news/inbox"
  output_dir: "/home/lenovo/gold-20news/output"

chunking:
  threshold_chars: 12000
  chunk_chars: 10000
  overlap_chars: 400

policy:
  never_delete: true
  local_only: true
  redact_pii_in_ledger: true
  fail_closed_on_personal_tax: true
