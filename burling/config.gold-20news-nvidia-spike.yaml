# 20news NVIDIA spike — public Usenet articles only. Not CTE.
# Talks to the local NIM proxy (:8787), which holds the API key.
# Nano 30B: 20 RPM (not the Ultra 4 RPM heavy gate). Step tester, not max IQ.
ollama:
  url: "http://127.0.0.1:8787"
  api: "openai"
  model: "nvidia/nemotron-3-nano-30b-a3b"
  timeout_seconds: 180
  temperature: 0.1
  max_tokens: 2048
  enable_thinking: false
  response_format: false

paths:
  intake_dir: "/home/lenovo/gold-20news/inbox"
  output_dir: "/home/lenovo/gold-20news/nvidia-spike"
  tags_json: "/home/lenovo/gold-20news/output/tags.json"

chunking:
  threshold_chars: 80000
  chunk_chars: 80000
  overlap_chars: 400

policy:
  never_delete: true
  local_only: true
  public_corpus: true
  redact_pii_in_ledger: true
  fail_closed_on_personal_tax: true
