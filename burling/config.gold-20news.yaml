# Public gold smoke: 20 Newsgroups by-date test, flattened.
# Fetch first:  python -m burling.fetch_gold --corpus 20newsgroups
# Run:          python -m burling.run --config burling/config.gold-20news.yaml --ralp
#
# This is a public folder tree (Layer 1.5). MultiEURLEX is still Layer 2.
ollama:
  url: "http://127.0.0.1:8080"
  api: "openai"
  model: "/home/lenovo/llama.cpp/models/nemotron35-lightning-30b.gguf"
  timeout_seconds: 600
  temperature: 0.1
  max_tokens: 4096
  enable_thinking: false

paths:
  intake_dir: "../.data/20newsgroups/inbox"
  output_dir: "output-gold-20news"

chunking:
  threshold_chars: 80000
  chunk_chars: 80000
  overlap_chars: 400

policy:
  never_delete: true
  local_only: true
  redact_pii_in_ledger: true
  fail_closed_on_personal_tax: true
